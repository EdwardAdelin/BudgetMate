<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: common_head('Profile | BudgetMate')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>
<div th:replace="~{fragments/components :: user_sidebar('profile')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/components :: topbar(false, '/profile', 'See Profile')}"></div>

    <div class="profile-header">
        <div class="profile-info">
            <div class="profile-pic">
                <img class="profile-pic-image" id="profilePicImage"
                     th:src="${user != null && user.profilePicture != null ? user.profilePicture : '/flamingo.webp'}"
                     alt="Profile picture">
                <input type="file" id="profilePicInput" accept="image/*" style="display: none;">
                <button type="button" class="update-btn" id="uploadPicBtn">Update Profile Picture</button>
            </div>
            <div>
                <div class="profile-name" id="profileUsername">John Doe</div>
            </div>
        </div>
        <button type="button" class="logout-btn">LogOut</button>
    </div>
    <div class="profile-content">
        <div class="update-title">Update Information</div>
        <form class="update-form">
            <div class="mb-3">
                <label for="updateUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="updateUsername" placeholder="Enter your username">
            </div>
            <div class="mb-3">
                <label for="updateEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="updateEmail" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="updatePassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="updatePassword" placeholder="Enter new password">
            </div>
            <button type="button" id="saveChangesBtn" class="save-btn">Save Changes</button>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/components :: scripts}"></th:block>
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
