<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: common_head('Register - Budget Tracker')}"></th:block>
    <style>
        .register-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 5px;
        }
        .error-message {
            color: red;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="register-container">
        <h2 class="text-center mb-4">Register</h2>
        <form id="registerForm" onsubmit="return handleRegister(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
                <div id="usernameError" class="error-message"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div id="emailError" class="error-message"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
                <div id="passwordError" class="error-message"></div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                <div id="confirmPasswordError" class="error-message"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <div class="text-center mt-3">
            <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/components :: scripts}"></th:block>
<script>
    function handleRegister(event) {
        event.preventDefault();

        document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
            document.getElementById('confirmPasswordError').style.display = 'block';
            return false;
        }

        const userData = {
            username: username,
            email: email,
            password: password
        };

        fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(userData)
        })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text || 'Registration failed');
                    });
                }
                return response.json();
            })
            .then(data => {
                alert('Registration successful! Please login.');
                window.location.href = '/login';
            })
            .catch(error => {
                if (error.message.includes('Username already exists')) {
                    document.getElementById('usernameError').textContent = 'Username already exists';
                    document.getElementById('usernameError').style.display = 'block';
                } else if (error.message.includes('Email already exists')) {
                    document.getElementById('emailError').textContent = 'Email already exists';
                    document.getElementById('emailError').style.display = 'block';
                } else {
                    alert('Registration failed: ' + error.message);
                }
            });

        return false;
    }
</script>
</body>
</html>
