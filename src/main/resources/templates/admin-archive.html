<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: common_head('Admin Archive | BudgetMate')}"></th:block>
    <!-- Legătura către fișierul CSS extern -->
    <link rel="stylesheet" th:href="@{/css/admin-archive.css}">
</head>
<body>
<div th:replace="~{fragments/components :: admin_sidebar('users')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/components :: topbar(false, '/admin-users', 'Admin Profile')}"></div>

    <div class="container-fluid">
        <div class="archive-title">Document Archive</div>

        <!-- Controale administrative și filtru utilizatori -->
        <div class="admin-controls">
            <div class="user-filter">
                <label for="userSelect" class="form-label">Filter by User:</label>
                <select id="userSelect" class="form-select">
                    <option value="">All Users</option>
                </select>
            </div>
        </div>

        <!-- Tabel documente -->
        <div class="table-responsive">
            <table class="table table-bordered document-table">
                <thead>
                <tr>
                    <th>Filename</th>
                    <th>User</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Upload Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="documentTableBody">
                <!-- Populat dinamic via admin-archive.js -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/components :: scripts}"></th:block>
<!-- Legătura către fișierul JS extern -->
<script th:src="@{/js/admin-archive.js}"></script>
</body>
</html>
