<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: common_head('Dashboard | BudgetMate')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div th:replace="~{fragments/components :: user_sidebar('dashboard')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/components :: topbar(true, '/profile', 'See Profile')}"></div>

    <div class="row mb-4">
        <div class="col d-flex justify-content-center"></div>
    </div>

    <div class="dashboard-container">
        <div class="row mb-4">
            <div class="col-md-4">
                <label for="monthSelect" class="form-label">Month</label>
                <select id="monthSelect" class="form-select">
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="yearSelect" class="form-label">Year</label>
                <select id="yearSelect" class="form-select"></select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button type="button" id="fetchStatsBtn" class="btn btn-primary w-100">Show Stats</button>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <div class="summary-card">
                    <div class="summary-title">Total Expenses</div>
                    <div class="summary-value" id="totalExpenses">-</div>
                </div>
            </div>
        </div>

        <div class="row" id="categoryTotalsRow">
            <h1>Category Totals</h1>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/components :: scripts}"></th:block>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
