<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: common_head('Add Expenses | BudgetMate')}"></th:block>
    <style>
        .expenses-container { padding: 2vw 2vw 0 2vw; }
        .expenses-title { font-size: 2.5rem; font-weight: bold; margin-bottom: 2rem; }
        .expenses-form { max-width: 700px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 2vw; }
        .form-label { font-weight: 500; }
        .category-btn { background: #f5f5f5; border: none; margin-right: 10px; margin-bottom: 10px; color: #333; border-radius: 6px; padding: 6px 18px; }
        .category-btn:focus { outline: 2px solid #222; }
        .category-btn.active { background: #222; color: #fff; border: 1px solid #111; }
        .form-section-title { font-size: 1.5rem; font-weight: bold; margin: 2rem 0 1rem 0; }
        .form-actions { display: flex; justify-content: flex-end; gap: 1vw; margin-top: 2vw; }
        .form-actions .btn { min-width: 180px; font-size: 1.1rem; font-weight: 500; border-radius: 8px; padding: 10px 0; }
        .form-actions .btn-primary { background: #111; border: none; }
    </style>
</head>
<body>
<div th:replace="~{fragments/components :: user_sidebar('expenses')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/components :: topbar(false, '/profile', 'See Profile')}"></div>

    <div class="expenses-container">
        <div class="expenses-title">Add Expenses</div>
        <form class="expenses-form">
            <div class="mb-4">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="Name" placeholder="Enter name">
            </div>
            <div class="mb-4">
                <label for="sum" class="form-label">Sum</label>
                <input type="number" class="form-control" id="sum" placeholder="Enter sum">
            </div>
            <div class="mb-4">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" placeholder="Select date">
            </div>
            <div class="mb-4">
                <label class="form-label">Category</label><br>
                <button type="button" class="category-btn">Food</button>
                <button type="button" class="category-btn">Transportation</button>
                <button type="button" class="category-btn">Utilities</button>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-outline-dark">Cancel</button>
                <button type="button" class="btn btn-primary">Upload</button>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/components :: scripts}"></th:block>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/categories')
            .then(res => res.json())
            .then(categories => {
                const catDiv = document.querySelector('.mb-4 .category-btn').parentElement;
                catDiv.innerHTML = '';
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'category-btn';
                    btn.textContent = cat.name;
                    btn.dataset.categoryId = cat.id;
                    btn.onclick = function() {
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        window.selectedCategoryId = cat.id;
                    };
                    catDiv.appendChild(btn);
                });
            });
    });

    document.querySelector('.expenses-form .btn-primary').onclick = async function(e) {
        e.preventDefault();
        const name = document.getElementById('Name').value;
        const sum = document.getElementById('sum').value;
        const date = document.getElementById('date').value;
        const categoryId = window.selectedCategoryId;
        if (!name || !sum || !date || !categoryId) {
            alert('Please fill all fields and select a category. If no category has ever been added, go to categories and add your expenses categories!');
            return;
        }
        const expense = { name: name, sum: sum, date: date, category: { id: categoryId } };
        const res = await fetch('/api/expenses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(expense)
        });
        if (res.ok) {
            alert('Expense added!');
            document.querySelector('.expenses-form').reset();
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        } else {
            alert('Failed to add expense.');
        }
    };
</script>
</body>
</html>
