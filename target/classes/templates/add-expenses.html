<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: common_head('Add Expenses | BudgetMate')}"></th:block>
    <!-- Legătura către fișierul CSS extern -->
    <link rel="stylesheet" th:href="@{/css/add-expenses.css}">
</head>
<body>
<!-- Inject Sidebar -->
<div th:replace="~{fragments/components :: user_sidebar('expenses')}"></div>

<div class="main-content">
    <!-- Inject Topbar -->
    <div th:replace="~{fragments/components :: topbar(false, '/profile', 'See Profile')}"></div>

    <div class="expenses-container">
        <div class="expenses-title">Add Expenses</div>
        <form class="expenses-form">
            <div class="mb-4">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter name">
            </div>
            <div class="mb-4">
                <label for="sum" class="form-label">Sum</label>
                <input type="number" step="0.01" class="form-control" id="sum" placeholder="Enter sum">
            </div>
            <div class="mb-4">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" placeholder="Select date">
            </div>
            <div class="mb-4">
                <label class="form-label">Category</label>
                <div id="categoryContainer" class="mt-2">
                    <button type="button" class="category-btn">Food</button>
                    <button type="button" class="category-btn">Transportation</button>
                    <button type="button" class="category-btn">Utilities</button>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-outline-dark">Cancel</button>
                <button type="button" id="submitExpenseBtn" class="btn btn-primary">Upload</button>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/components :: scripts}"></th:block>
<!-- Legătura către fișierul JS extern -->
<script th:src="@{/js/add-expenses.js}"></script>
</body>
</html>
