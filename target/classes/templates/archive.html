<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: common_head('Archive | BudgetMate')}"></th:block>
    <style>
        .archive-title { font-size: 2.5rem; font-weight: bold; margin-top: 2rem; margin-bottom: 2rem; }
        .archive-row { display: flex; flex-wrap: wrap; gap: 2vw; margin-bottom: 2vw; }
        .archive-card { background: #f5f5f5; border-radius: 10px; min-width: 200px; max-width: 220px; flex: 1 1 200px; height: 340px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.02); border: 1px solid #eee; position: relative; }
        .archive-card .badge { position: absolute; top: 10px; left: 10px; background: #e5e5e5; color: #222; font-size: 0.9rem; border-radius: 5px; padding: 2px 10px; }
        .archive-card .archive-type { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #444; }
        .archive-card .archive-footer { background: #fff; border-radius: 0 0 10px 10px; padding: 12px 18px; border-top: 1px solid #eee; }
        .archive-card .archive-footer .name { font-weight: 500; }
        .archive-card .archive-footer .size { font-weight: bold; font-size: 1.1rem; }
        .archive-circle { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 2vw; }
        .archive-circle-img { width: 90px; height: 90px; border-radius: 50%; background: #f5f5f5; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .archive-circle-img img { width: 60px; height: 60px; object-fit: contain; }
        .archive-circle .title { font-weight: 500; font-size: 1.2rem; margin-bottom: 2px; }
        .archive-circle .desc { color: #888; font-size: 1rem; margin-bottom: 5px; }
        .archive-circle .size { font-weight: bold; font-size: 1.5rem; }
        @media (max-width: 1100px) { .archive-row { flex-direction: column; gap: 1vw; } .archive-circle { margin: 2vw 0; } }
    </style>
</head>
<body>
<div th:replace="~{fragments/components :: user_sidebar('archive')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/components :: topbar(false, '/profile', 'Profile')}"></div>

    <div class="container-fluid">
        <div class="archive-title">Archive</div>
        <div class="mb-4">
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                <i class="bi bi-plus-circle"></i> Add Document
            </button>
            <input type="file" id="fileInput" accept=".pdf,image/*" style="display:none" multiple onchange="handleFiles(this.files)">
        </div>
        <div id="documentList" class="list-group mb-4"></div>

        <script>
            function handleFiles(files) {
                const list = document.getElementById('documentList');
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const item = document.createElement('div');
                    item.className = 'list-group-item';
                    item.textContent = file.name + ' (' + Math.round(file.size/1024) + ' KB) - Uploading...';
                    list.appendChild(item);

                    const formData = new FormData();
                    formData.append('file', file);

                    fetch('/api/documents/upload', {
                        method: 'POST',
                        body: formData
                    })
                        .then(response => {
                            if (response.ok) {
                                item.textContent = file.name + ' (' + Math.round(file.size/1024) + ' KB) - Uploaded';
                            } else {
                                item.textContent = file.name + ' (' + Math.round(file.size/1024) + ' KB) - Failed';
                            }
                        })
                        .catch(() => {
                            item.textContent = file.name + ' (' + Math.round(file.size/1024) + ' KB) - Error';
                        });
                }
            }
            function fetchDocuments() {
                fetch('/api/documents/my-files')
                    .then(res => res.json())
                    .then(files => {
                        const list = document.getElementById('documentList');
                        list.innerHTML = '';
                        files.forEach(file => {
                            const item = document.createElement('div');
                            item.className = 'list-group-item';
                            const link = document.createElement('a');
                            link.href = `/api/documents/download/${file.id}`;
                            link.textContent = file.filename;
                            link.download = file.filename;
                            link.style.cursor = 'pointer';
                            link.onclick = function(e) {
                                e.preventDefault();
                                fetch(link.href)
                                    .then(resp => resp.blob())
                                    .then(blob => {
                                        const url = window.URL.createObjectURL(blob);
                                        const a = document.createElement('a');
                                        a.style.display = 'none';
                                        a.href = url;
                                        a.download = file.filename;
                                        document.body.appendChild(a);
                                        a.click();
                                        window.URL.revokeObjectURL(url);
                                    });
                            };
                            item.appendChild(link);
                            list.appendChild(item);
                        });
                    });
            }
            fetchDocuments();
        </script>
    </div>
</div>

<th:block th:replace="~{fragments/components :: scripts}"></th:block>
</body>
</html>
