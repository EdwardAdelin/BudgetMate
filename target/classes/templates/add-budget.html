<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/components :: common_head('Add Budget | BudgetMate')}"></th:block>
    <!-- Legătura către fișierul CSS extern -->
    <link rel="stylesheet" th:href="@{/css/add-budget.css}">
</head>
<body>
<!-- Inject Sidebar -->
<div th:replace="~{fragments/components :: user_sidebar('budget')}"></div>

<div class="main-content">
    <!-- Inject Topbar -->
    <div th:replace="~{fragments/components :: topbar(false, '/profile', 'See Profile')}"></div>

    <div class="add-budget-container">
        <div class="add-budget-title">Add Category & Budget</div>
        <form class="add-budget-form">
            <div class="mb-4">
                <label for="budgetName" class="form-label">Category Name</label>
                <input type="text" class="form-control" id="budgetName" placeholder="Enter budget name">
            </div>
            <div class="mb-4">
                <label for="allocatedBudget" class="form-label">Allocated Budget for month</label>
                <input type="number" class="form-control" id="allocatedBudget" placeholder="Enter maximum allocated amount">
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-outline-dark">Cancel</button>
                <button type="button" id="submitBudgetBtn" class="btn btn-primary">Add Budget</button>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/components :: scripts}"></th:block>
<!-- Legătura către fișierul JS extern -->
<script th:src="@{/js/add-budget.js}"></script>
</body>
</html>
